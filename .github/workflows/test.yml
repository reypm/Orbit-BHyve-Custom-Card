name: Unit Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        # Globbed rather than named: v3 renamed the card file and this step kept
        # pointing at the old name, so CI failed on a file that no longer existed.
        run: |
          shopt -s nullglob
          found=0
          for f in *.js; do
            echo "node --check $f"
            node --check "$f"
            found=1
          done
          if [ "$found" -eq 0 ]; then
            echo "No JavaScript files found at the repository root" >&2
            exit 1
          fi

      - name: Run unit tests
        run: node validate.test.js
